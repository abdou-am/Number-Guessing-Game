<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scenario 1</title>
</head>
<body>
    <p class = "header">i'm thinking of a number between 1 and 100 , try to find it</p>
    <div class="inputs">
        <div class="input-and-label">
            <label for="guess">enter your guess</label>
            <input type="number" placeholder = "e.g . 24" id = "guess">
        </div>
        <button id = "submit">submit</button> 
    </div>
    <p id = "PcResponse"></p>
    <style>
        *{
            padding : 0px;
            margin : 0px;
            box-sizing: border-box;
            font-family: 'inter',sans-serif;
            letter-spacing: -1px;
        }
        body{
            min-height: 100vh;
            display : flex;
            flex-direction : column;
            justify-content : center;
            align-items : center;
            text-align : center;
            background : linear-gradient(#FFC233,#FFF4DB);
            gap : 70px;
        }
        .header{
            color: white;
            font-size : 500%;
            font-weight : 900;
            letter-spacing : -4px;
        }
        .inputs{
            display : flex;
            justify-content: center;
            align-items : center;
            color : white;
            gap : 10px;
            align-items : flex-end;
        }
        .input-and-label{
            display : flex;
            flex-direction : column;
            justify-content: flex-start;
            width : 100%;
            text-align: left;
        }
        label{
            font-weight : 800;
            font-size : 110%;
        }
        input{
            width : 300px;
            outline: none;
            border : none;
            padding : 10px 10px;
            border-radius : 9px;
        }
        input:focus , input::placeholder{
            color : #FFC233;
        }
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
          -webkit-appearance: none;
          margin: 0;
        }

        input[type=number] {
          -moz-appearance: textfield;
        }
        button{
            outline: none;
            border : none;
            padding : 7px 15px;
            color : white;
            background-color: #FFC233;
            border-radius : 200px;
            font-size : 130%;
            font-weight: 600;
            transition : all 0.2s;
        }
        button:hover{
            background-color: #ffd164;
            cursor : pointer;
        }
        #PcResponse{
            color :#FFC233;
            font-size : 300%;
            font-weight : 800;
            letter-spacing : -2px;
        }
    </style>
    <script src = "random_game_se1.js"></script>
</body>
</html>
